service:

  web:
    image: nginx:1.31.8-alpine
    container_name: your_web-name
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - WORDPRESS_DOMAIN=${WORDPRESS_DOMAIN}
      - WORDPRESS_UPSTREAM=php
    volumes:
      - ./html/myweb:/var/html/www:ro
      - ./conf.d:/etc/nginx/templates
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php
    networks:
      - some-network
  
  php:
    image: wordpress:7.1.3-php8.5-fpm-alpine
    container_name: your_wordpress-name
    restart: unless-stopped
    environment:
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - WORDPRESS_DB_USER=${MARIADB_USER}
      - WORDPRESS_DB_PASSWORD=${MARIADB_PASSWORD}
      - WORDPRESS_DB_NAME=${MARIADB_DATABASE}
    volumes:
      - ./html/myweb:/var/html/www
    depends_on:
      - db
    networks:
      - some-network

  db:
    image: mariadb:11.8
    container_name: your_database-name
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_AUTO_UPGRADE= 1
    volumes:
      - /var/lib/docker-volume/wordpress/mariadb:/var/lib/mysql
    networks:
      - some-network

networks:
  some-network:
    external: true

     

